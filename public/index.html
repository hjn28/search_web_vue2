<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,minimum-scale=1, user-scalable=no">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title>综合分析</title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but 综合分析 doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
    <script src="<%= BASE_URL %>static/html-docx.js"></script>
    <script>
        const baseSize = 16
        // 设置 rem 函数
        function setRem () {
          const rawScale = document.documentElement.clientWidth / 960
          const scale = Math.min(rawScale, 1.3) // 之前是2倍，限制放大倍数，避免字体过大
          document.documentElement.style.fontSize = (baseSize * scale) + 'px'
        }
        // 初始化
        setRem()
        // 改变窗口大小时重新设置 rem
        window.onresize = function () {
          setRem()
        }
    </script>
  </body>
</html>
